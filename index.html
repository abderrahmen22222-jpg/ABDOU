<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duru'nun Dünyası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; cursor: none; background-color: #fffafa; transition: background-color 1s ease; scroll-behavior: smooth; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        #custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: rgba(236, 72, 153, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-enter { animation: revealEffect 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        @keyframes revealEffect {
            from { opacity: 0; filter: blur(10px); transform: translateY(30px) scale(0.95); }
            to { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1); }
        }

        .vibe-active { animation: vibe-pulse 3s infinite ease-in-out; }
        @keyframes vibe-pulse {
            0%, 100% { background-color: #fffafa; }
            50% { background-color: #fff1f5; }
        }

        .memory-particle {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            z-index: 0;
            animation: float-up linear forwards;
        }
        @keyframes float-up {
            0% { transform: translateY(0px) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.5); opacity: 0; }
        }

        .floating-emoji {
            animation: floating 4s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-25px) rotate(5deg); }
        }

        .polaroid {
            background: white;
            padding: 1rem 1rem 3.5rem 1rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            transform: rotate(var(--rotation));
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .polaroid:hover {
            transform: rotate(0deg) scale(1.1) translateY(-10px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            z-index: 20;
        }

        .stagger-reveal > * {
            opacity: 0;
            animation: staggerIn 0.8s forwards;
        }
        @keyframes staggerIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .letter-content {
            background-image: radial-gradient(#fecdd3 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="overflow-x-hidden">
    <div id="custom-cursor">💖</div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [stage, setStage] = useState('intro');
            const [activeTab, setActiveTab] = useState('home'); 
            const [wishes, setWishes] = useState([]);
            const [currentWish, setCurrentWish] = useState("");
            const [isVibeActive, setIsVibeActive] = useState(false);
            const [particles, setParticles] = useState([]);

            useEffect(() => {
                lucide.createIcons();
                const cursor = document.getElementById('custom-cursor');
                const moveCursor = (e) => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                };
                window.addEventListener('mousemove', moveCursor);

                let interval;
                if (isVibeActive) {
                    interval = setInterval(() => {
                        const id = Date.now();
                        const icons = ['✨', '💖', '⭐', '🌸', '🎈', '🍭', '🦋'];
                        const newParticle = {
                            id,
                            left: Math.random() * 100 + 'vw',
                            duration: 3 + Math.random() * 5 + 's',
                            content: icons[Math.floor(Math.random() * icons.length)],
                            size: 15 + Math.random() * 30 + 'px'
                        };
                        setParticles(prev => [...prev.slice(-25), newParticle]);
                    }, 400);
                }
                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                    clearInterval(interval);
                };
            }, [isVibeActive]);

            useEffect(() => {
                window.scrollTo(0, 0);
                lucide.createIcons();
            }, [activeTab]);

            const handleEnter = () => setStage('main');
            const navigateTo = (tab) => setActiveTab(tab);

            const releaseWish = (e) => {
                e.preventDefault();
                if (!currentWish.trim()) return;
                setWishes([...wishes, { id: Date.now(), text: currentWish }]);
                setCurrentWish("");
            };

            const renderHome = () => (
                <div className="page-enter space-y-32 pb-40 pt-10">
                    <section className="text-center py-10 relative">
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 -z-10 opacity-20 blur-3xl w-96 h-96 bg-pink-300 rounded-full animate-pulse"></div>
                        <h1 className="text-8xl md:text-[12rem] font-serif text-gray-900 opacity-90 tracking-tighter hover:scale-105 transition-transform duration-1000 cursor-default">Duru</h1>
                        <p className="text-pink-400 tracking-[0.4em] uppercase text-xs font-bold mt-4 animate-bounce">Hayat Boyu Sürecek Bir Keşif</p>
                    </section>
                    
                    <section className="bg-white p-12 md:p-24 rounded-[3.5rem] border border-pink-50 shadow-2xl max-w-4xl mx-auto transform -rotate-1 hover:rotate-0 transition-all duration-1000 group">
                        <div className="flex justify-center mb-8 text-amber-300 group-hover:rotate-180 transition-transform duration-1000">
                            <i data-lucide="sparkles" className="w-16 h-16"></i>
                        </div>
                        <p className="text-2xl md:text-4xl leading-relaxed font-light text-gray-700 italic text-center">
                            "İlk üç yıl seni her gün görüyordum ama ne kadar özel biri olduğunu hiç fark etmemiştim... Ta ki bu son üç yıla kadar. Şimdi okulun sensiz nasıl olacağını hayal bile edemiyorum."
                        </p>
                    </section>

                    <section className="max-w-5xl mx-auto px-4">
                        <h2 className="text-4xl font-serif text-center mb-16">Altı Yıllık Değişim</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div className="bg-gray-50/50 p-10 rounded-[3rem] border border-gray-100 opacity-60 hover:opacity-100 transition-all duration-500 hover:scale-[1.02]">
                                <span className="text-xs font-black text-gray-400 uppercase tracking-widest block mb-4">İlk 3 Yıl</span>
                                <h3 className="text-2xl font-serif mb-4">Göz Önünde Ama Gizli</h3>
                                <p className="text-gray-500 leading-relaxed">
                                    Aynı okulu, aynı havayı paylaştık ama neredeyse hiç konuşmadık. Sadece birkaç sıra ötemde oturan o kızın, gün gelip en değerli dostum olacağını bilmiyordum.
                                </p>
                            </div>
                            <div className="bg-white p-10 rounded-[3rem] border-2 border-pink-100 shadow-xl relative overflow-hidden group hover:scale-[1.05] transition-all duration-700">
                                <div className="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-100 transition-opacity">
                                    <i data-lucide="heart" className="w-12 h-12 text-pink-500 fill-current"></i>
                                </div>
                                <span className="text-xs font-black text-pink-500 uppercase tracking-widest block mb-4">Son 3 Yıl</span>
                                <h3 className="text-2xl font-serif mb-4 text-pink-900">En Güzel Keşif</h3>
                                <p className="text-pink-800/70 leading-relaxed">
                                    Nihayet konuşmaya başladığımızda her şey değişti. Nazikliğinin, mizahının ve ruhunun milyarda bir olduğunu anladım. Bu yıllar hayatımın en güzel yılları oldu.
                                </p>
                            </div>
                        </div>
                    </section>

                    <section className="text-center space-y-12">
                        <h2 className="text-4xl font-serif">Duru'nun Sırları</h2>
                        <div className="flex justify-center gap-10 md:gap-20">
                            {[
                                { emoji: '✨', tab: 'beauty', label: 'Zarafeti' },
                                { emoji: '🌸', tab: 'friendly', label: 'Dostluğu' },
                                { emoji: '💖', tab: 'lovely', label: 'Ruhu' }
                            ].map((item, idx) => (
                                <button key={idx} onClick={() => navigateTo(item.tab)} className="group flex flex-col items-center gap-4 transition-all hover:scale-125 active:scale-95">
                                    <div className="w-24 h-24 bg-white rounded-full shadow-xl flex items-center justify-center text-4xl floating-emoji border border-pink-50 group-hover:border-pink-300 transition-all group-hover:shadow-pink-200/50">
                                        {item.emoji}
                                    </div>
                                    <span className="text-[10px] uppercase tracking-widest font-black text-gray-400 group-hover:text-pink-500">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </section>
                </div>
            );

            const renderTraitPage = (title, emoji, text, image, colorClass) => (
                <div className="page-enter min-h-screen flex flex-col items-center py-20 px-6">
                    <button onClick={() => navigateTo('home')} className="mb-12 text-gray-400 hover:text-pink-500 flex items-center gap-2 transition-all hover:-translate-x-3 self-start md:ml-20">
                        <i data-lucide="arrow-left" className="w-5 h-5"></i>
                        <span className="text-xs font-bold uppercase tracking-widest">Ana Sayfaya Dön</span>
                    </button>
                    
                    <div className="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                        <div className="rounded-[4.5rem] overflow-hidden shadow-[0_50px_100px_-20px_rgba(0,0,0,0.4)] aspect-[3/4] hover:scale-[1.02] transition-transform duration-1000">
                            <img src={image} className="w-full h-full object-cover" alt={title} />
                        </div>
                        <div className="space-y-10 stagger-reveal">
                            <div className={`text-8xl animate-bounce ${colorClass}`}>{emoji}</div>
                            <h2 className="text-7xl font-serif text-gray-900">{title}</h2>
                            <p className="text-2xl text-gray-600 leading-relaxed italic font-light border-l-4 border-pink-100 pl-8">
                                {text}
                            </p>
                            <div className="pt-8 flex gap-6 items-center">
                                <div className="h-0.5 w-16 bg-pink-200" />
                                <p className="text-sm uppercase tracking-[0.4em] text-pink-400 font-bold animate-pulse">Bizim Gerçek Yıldızımız</p>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderLetter = () => (
                <div className="page-enter max-w-4xl mx-auto py-20 px-4">
                    <div className="bg-white rounded-[4rem] shadow-2xl overflow-hidden relative border border-pink-50 hover:shadow-pink-100/50 transition-all duration-1000">
                        <div className="h-24 bg-pink-50 flex items-center justify-center">
                            <i data-lucide="mail" className="w-8 h-8 text-pink-400 animate-bounce"></i>
                        </div>
                        <div className="p-12 md:p-20 letter-content">
                            <h2 className="text-5xl font-serif text-gray-900 mb-12 text-center">Canım Duru'ya</h2>
                            <div className="space-y-8 text-xl md:text-2xl text-gray-700 leading-[1.8] font-light italic">
                                <p>
                                    Paylaştığımız her şeyi düşünürken gülümsemeden edemiyorum. Son üç yıla baktığımda, sanki uykudan uyanmış ve bunca zamandır yanımda olan o harika insanı sonunda fark etmişim gibi hissediyorum.
                                </p>
                                <p>
                                    Tüm kalbimle umuyorum ki bu sadece hayatımızdaki bir bölüm değil, hiç bitmeyecek bir hikayenin başlangıcıdır. Sen benim için sadece bir okul arkadaşından çok daha fazlasısın; hayran olduğum, güvendiğim ve sadece varlığınla bile dünyayı daha parlak kılan birisin.
                                </p>
                                <p>
                                    Ömür boyu en iyi arkadaş kalmamızı diliyorum. En büyük başarılarında, en sakin anlarında ve aradaki her şeyde yanında olmak istiyorum. Hayat bizi bu koridorlardan sonra nereye götürürse götürsün, kalbimde her zaman çok özel bir yerin olacağını bilmeni isterim.
                                </p>
                                <p className="pt-8 text-right font-serif text-3xl text-pink-500">
                                    Daima Dostun,
                                </p>
                            </div>
                        </div>
                        <div className="absolute top-10 right-10 rotate-12 opacity-20">
                            <i data-lucide="stamp" className="w-20 h-20 text-pink-600"></i>
                        </div>
                    </div>
                    
                    <div className="mt-20 text-center animate-pulse">
                        <i data-lucide="infinity" className="w-12 h-12 text-pink-200 mx-auto"></i>
                        <p className="text-xs uppercase tracking-[0.5em] text-gray-400 mt-4 font-bold">Ömür Boyu En İyi Dostlar</p>
                    </div>
                </div>
            );

            const renderWishes = () => (
                <div className="page-enter max-w-4xl mx-auto text-center space-y-16 py-20 px-4">
                    <div className="bg-gray-950 p-20 rounded-[5rem] shadow-3xl relative overflow-hidden text-white group">
                        <div className="absolute -top-24 -left-24 w-64 h-64 bg-pink-500/20 rounded-full blur-[80px] group-hover:bg-pink-500/30 transition-all duration-1000"></div>
                        <h2 className="text-5xl font-serif mb-6">Dilek Fenerleri</h2>
                        <p className="text-pink-200/40 text-xs mb-12 tracking-widest uppercase">Onun dünyasına parlayan bir mesaj gönder</p>
                        <form onSubmit={releaseWish} className="relative mb-20 max-w-lg mx-auto z-10">
                            <input type="text" value={currentWish} onChange={(e) => setCurrentWish(e.target.value)} placeholder="Bir mesaj yaz..."
                                className="w-full bg-white/5 border border-white/10 rounded-full px-10 py-6 focus:outline-none focus:ring-2 focus:ring-pink-500 text-white placeholder:text-white/20 transition-all backdrop-blur-sm"
                            />
                            <button type="submit" className="absolute right-4 top-4 p-4 bg-pink-600 rounded-full hover:bg-pink-400 transition-all hover:rotate-12 active:scale-90 shadow-lg">
                                <i data-lucide="send" className="w-6 h-6"></i>
                            </button>
                        </form>
                        <div className="flex flex-wrap justify-center gap-6">
                            {wishes.map(w => (
                                <div key={w.id} className="py-4 px-8 bg-white/10 rounded-full text-md text-pink-100 border border-white/10 animate-bounce hover:bg-pink-600 transition-colors cursor-default">✨ {w.text}</div>
                            ))}
                        </div>
                    </div>

                    <div className="py-20">
                        <h3 className="text-4xl font-serif mb-16 tracking-tight">Anların Galerisi</h3>
                        <div className="flex flex-wrap justify-center gap-12">
                            {[
                                { img: "https://i.imgur.com/sSeCbRA.jpeg", rot: "-4deg" },
                                { img: "https://i.imgur.com/zfPZJen.jpeg", rot: "3deg" },
                                { img: "https://i.imgur.com/8HTqveh.jpeg", rot: "-2deg" },
                                { img: "https://i.imgur.com/Ia4iEja.jpeg", rot: "5deg" }
                            ].map((p, i) => (
                                <div key={i} className="polaroid cursor-crosshair" style={{"--rotation": p.rot}}>
                                    <img src={p.img} className="w-56 h-56 object-cover grayscale hover:grayscale-0 transition-all duration-[1.5s]" alt="Duru Polaroid" />
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            if (stage === 'intro') {
                return (
                    <div className="min-h-screen bg-[#050510] flex flex-col items-center justify-center relative overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            {[...Array(40)].map((_, i) => (
                                <div key={i} className="absolute bg-white rounded-full animate-pulse" 
                                    style={{ 
                                        width: Math.random() * 3 + 'px', 
                                        height: Math.random() * 3 + 'px', 
                                        top: Math.random() * 100 + '%', 
                                        left: Math.random() * 100 + '%',
                                        animationDelay: Math.random() * 5 + 's'
                                    }} 
                                />
                            ))}
                        </div>
                        <div className="text-center z-10 space-y-14 stagger-reveal">
                            <h1 className="text-pink-100 text-7xl font-serif tracking-[0.2em] animate-pulse">Duru'nun Evreni</h1>
                            <button onClick={handleEnter} className="group relative hover:scale-110 transition-transform duration-700">
                                <div className="absolute inset-0 bg-pink-500/20 rounded-full blur-[80px] group-hover:blur-[100px] transition-all" />
                                <i data-lucide="heart" className="w-40 h-40 text-pink-600 fill-current relative drop-shadow-[0_0_30px_rgba(236,72,153,1)] animate-bounce"></i>
                            </button>
                            <p className="text-white/40 text-sm tracking-[0.5em] uppercase font-bold">Gerçeği Keşfet</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen pb-40 transition-all duration-[2000ms] ${isVibeActive ? 'vibe-active' : ''}`}>
                    {particles.map(p => (
                        <div key={p.id} className="memory-particle" style={{ left: p.left, animationDuration: p.duration, fontSize: p.size }}>{p.content}</div>
                    ))}

                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] bg-white/60 backdrop-blur-2xl border border-pink-100/50 px-10 py-5 rounded-full shadow-[0_20px_50px_rgba(0,0,0,0.1)] flex items-center gap-12 hover:px-14 transition-all duration-700">
                        {[
                            { id: 'home', icon: 'home', label: 'Ev' },
                            { id: 'letter', icon: 'pen-tool', label: 'Mektup' },
                            { id: 'wishes', icon: 'sparkles', label: 'Dilekler' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => navigateTo(tab.id)}
                                className={`flex flex-col items-center gap-2 transition-all ${activeTab === tab.id || (['beauty', 'friendly', 'lovely'].includes(activeTab) && tab.id === 'home') ? 'text-pink-600 scale-125' : 'text-gray-400 hover:text-pink-300 hover:scale-110'}`}
                            >
                                <i data-lucide={tab.icon} className="w-6 h-6"></i>
                                <span className="text-[10px] font-black uppercase tracking-widest">{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    <button onClick={() => setIsVibeActive(!isVibeActive)}
                        className={`fixed top-8 right-8 z-[110] p-5 rounded-full border shadow-2xl transition-all hover:scale-110 ${isVibeActive ? 'bg-pink-600 text-white border-white animate-spin-slow' : 'bg-white text-pink-400 border-pink-100'}`}
                    >
                        <i data-lucide={isVibeActive ? "music" : "volume-x"} className="w-7 h-7"></i>
                    </button>

                    <div className="px-6 max-w-7xl mx-auto pt-10">
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'letter' && renderLetter()}
                        {activeTab === 'wishes' && renderWishes()}
                        
                        {activeTab === 'beauty' && renderTraitPage(
                            "Gerçekten Güzel", "✨", 
                            "Duru'nun güzelliği sadece yüzeyde değil; asıl zarafeti onun varlığında saklı. Girdiği her odayı aydınlatıyor. Onun güzelliği, kalbindeki iyiliğin sadece bir yansıması.",
                            "https://i.imgur.com/zfPZJen.jpeg", "text-amber-400"
                        )}
                        
                        {activeTab === 'friendly' && renderTraitPage(
                            "En İyi Dost", "🌸", 
                            "Yollarımız üç yıl önce tam anlamıyla kesiştiğinden beri Duru sarsılmaz bir dayanak oldu. O sadece bir arkadaş değil; tanışabileceğiniz en güvenilir insan.",
                            "https://i.imgur.com/8HTqveh.jpeg", "text-pink-300"
                        )}

                        {activeTab === 'lovely' && renderTraitPage(
                            "Saf Bir Ruh", "💖", 
                            "En tatlı, en sevgi dolu kalbe sahip. Herkese karşı her zaman kabul edici, nazik ve yardımsever. O gerçekten eşsiz bir keşif.",
                            "https://i.imgur.com/Ia4iEja.jpeg", "text-pink-500"
                        )}
                    </div>

                    <footer className="mt-40 text-center opacity-40 py-16">
                        <div className="w-16 h-1 bg-pink-100 mx-auto mb-8 rounded-full"></div>
                        <p className="font-serif italic text-2xl tracking-widest text-gray-400">Duru'yu Keşfetmek</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
