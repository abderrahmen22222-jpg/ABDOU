<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duru'nun Dünyası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; cursor: none; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Custom Cursor */
        #custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: rgba(236, 72, 153, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        .memory-particle {
            position: fixed;
            bottom: -50px;
            pointer-events: none;
            z-index: 0;
            animation: float linear forwards;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 15s linear infinite; }

        /* Vibe Pulse */
        .vibe-active {
            animation: vibe-pulse 2s infinite ease-in-out;
        }
        @keyframes vibe-pulse {
            0%, 100% { background-color: #fffafa; }
            50% { background-color: #fff1f5; }
        }
    </style>
</head>
<body class="overflow-x-hidden">
    <div id="custom-cursor">💖</div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [stage, setStage] = useState('intro');
            const [complimentIndex, setComplimentIndex] = useState(0);
            const [showConfetti, setShowConfetti] = useState(false);
            const [clicks, setClicks] = useState(0);
            const [wishes, setWishes] = useState([]);
            const [currentWish, setCurrentWish] = useState("");
            const [message, setMessage] = useState("");
            const [isVibeActive, setIsVibeActive] = useState(false);
            const [particles, setParticles] = useState([]);

            const photos = [
                { url: "https://i.imgur.com/sSeCbRA.jpeg", caption: "En Güzel Gülüş" },
                { url: "https://i.imgur.com/zfPZJen.jpeg", caption: "Unutulmaz Bir An" },
                { url: "https://i.imgur.com/8HTqveh.jpeg", caption: "Dostluğun Işığı" },
                { url: "https://i.imgur.com/Ia4iEja.jpeg", caption: "Zarafet ve Nezaket" }
            ];

            const compliments = [
                "Dünyanın en iyi kalpli insanı!", "Tanıdığım en harika kız!", "Sınıfımızın neşesi!",
                "Hayatımda karşılaştığım en özel insan.", "Gülüşün dünyayı aydınlatıyor!",
                "Dürüstlüğünle her zaman ilham veriyorsun.", "Seninle her an daha değerli!",
                "Zarafetin ve nezaketinle çok özelsin.", "Zekanla herkesi kendine hayran bırakıyorsun!",
                "Pozitif enerjinle etrafına ışık saçıyorsun.", "Dostluğun benim için çok kıymetli.",
                "Her zaman yardıma koşan altın kalpli biri!", "Seninle sohbet etmek dünyanın en keyifli şeyi.",
                "Her zorlukta dimdik duran güçlü bir karakter!", "Samimiyetinle insanlara güven veriyorsun.",
                "Gelecekte çok başarılı olacağına eminim!", "Fikirlerin her zaman çok değerli.",
                "Senin gibi bir dost her şeye bedel.", "Mütevazılığın seni daha da güzelleştiriyor.",
                "İyi ki yollarımız Cezayir'de kesişmiş!"
            ];

            useEffect(() => {
                // Lucide icons init
                lucide.createIcons();

                // Custom Cursor logic
                const cursor = document.getElementById('custom-cursor');
                const moveCursor = (e) => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                };
                window.addEventListener('mousemove', moveCursor);

                // Particle Spawner for "Vibe Mode"
                let interval;
                if (isVibeActive) {
                    interval = setInterval(() => {
                        const id = Date.now();
                        const icons = ['✨', '💖', '☕', '⭐', '🌸'];
                        const newParticle = {
                            id,
                            left: Math.random() * 100 + 'vw',
                            duration: 5 + Math.random() * 5 + 's',
                            content: icons[Math.floor(Math.random() * icons.length)],
                            size: 15 + Math.random() * 20 + 'px'
                        };
                        setParticles(prev => [...prev.slice(-15), newParticle]);
                    }, 1000);
                }

                return () => {
                    window.removeEventListener('mousemove', moveCursor);
                    clearInterval(interval);
                };
            }, [stage, complimentIndex, wishes, message, isVibeActive]);

            const handleEnter = () => {
                setShowConfetti(true);
                setTimeout(() => {
                    setStage('main');
                    setShowConfetti(false);
                }, 1000);
            };

            const nextCompliment = () => {
                setComplimentIndex((prev) => (prev + 1) % compliments.length);
                setClicks(prev => prev + 1);
            };

            const showToast = (txt) => {
                setMessage(txt);
                setTimeout(() => setMessage(''), 3000);
            };

            const releaseWish = (e) => {
                e.preventDefault();
                if (!currentWish.trim()) return;
                setWishes([...wishes, { id: Date.now(), text: currentWish }]);
                setCurrentWish("");
                showToast("Dileğin gökyüzüne gönderildi! ✨");
            };

            if (stage === 'intro') {
                return (
                    <div className="min-h-screen bg-[#050510] flex flex-col items-center justify-center relative overflow-hidden">
                        {[...Array(40)].map((_, i) => (
                            <div key={i} className="absolute bg-white rounded-full animate-pulse"
                                style={{
                                    width: Math.random() * 3 + 'px',
                                    height: Math.random() * 3 + 'px',
                                    left: Math.random() * 100 + '%',
                                    top: Math.random() * 100 + '%',
                                    animationDelay: Math.random() * 5 + 's',
                                    opacity: Math.random()
                                }}
                            />
                        ))}
                        <div className="relative z-10 text-center flex flex-col items-center gap-10">
                            <div className="space-y-4">
                                <h1 className="text-pink-100 text-6xl font-serif tracking-widest">Duru'nun Dünyası</h1>
                                <p className="text-pink-300/40 tracking-[0.4em] uppercase text-xs">Sihirli bir yolculuğa başla</p>
                            </div>
                            <button onClick={handleEnter} className="group relative transition-all duration-700 hover:scale-110 active:scale-95">
                                <div className="absolute inset-0 bg-pink-500/30 rounded-full blur-3xl group-hover:blur-[60px] transition-all animate-pulse" />
                                <i data-lucide="heart" className="w-40 h-40 text-pink-500 fill-current relative z-10 drop-shadow-[0_0_35px_rgba(236,72,153,0.8)]"></i>
                            </button>
                            <p className="text-pink-200/60 text-sm font-light italic animate-bounce">Girmek için tıkla...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen transition-colors duration-1000 selection:bg-pink-200 overflow-x-hidden ${isVibeActive ? 'vibe-active' : 'bg-[#fffafa]'}`}>
                    
                    {/* Floating Particles */}
                    {particles.map(p => (
                        <div key={p.id} className="memory-particle" style={{ left: p.left, animationDuration: p.duration, fontSize: p.size }}>
                            {p.content}
                        </div>
                    ))}

                    <div className="h-1.5 bg-gradient-to-r from-pink-300 via-amber-200 to-pink-300 sticky top-0 z-50 shadow-sm" />

                    {/* Vibe Mode Toggle */}
                    <button 
                        onClick={() => setIsVibeActive(!isVibeActive)}
                        className={`fixed top-8 right-8 z-[60] px-6 py-3 rounded-full flex items-center gap-3 shadow-xl transition-all border-2 ${isVibeActive ? 'bg-pink-500 text-white border-white animate-pulse' : 'bg-white text-gray-500 border-pink-50 hover:bg-pink-50'}`}
                    >
                        <i data-lucide={isVibeActive ? "music" : "volume-x"} className="w-5 h-5"></i>
                        <span className="text-[10px] font-bold uppercase tracking-widest">{isVibeActive ? 'Vibe Mode: ON' : 'Vibe Mode: OFF'}</span>
                    </button>

                    <header className="relative pt-32 pb-20 px-4 text-center">
                        <div className="max-w-4xl mx-auto relative z-10">
                            <h1 className="text-8xl md:text-[12rem] font-serif text-gray-900 mt-4 mb-8 tracking-tighter opacity-90">Duru</h1>
                            <div className="flex justify-center items-center gap-6 text-pink-300">
                                <div className="h-0.5 w-16 bg-pink-100" />
                                <p className="italic font-light tracking-widest text-xl">Dostluğun en saf hali...</p>
                                <div className="h-0.5 w-16 bg-pink-100" />
                            </div>
                        </div>
                    </header>

                    <main className="max-w-5xl mx-auto px-6 pb-40 space-y-48 relative z-10">
                        <section className="relative group">
                            <div className="absolute inset-0 bg-white rotate-2 shadow-2xl rounded-[3rem] group-hover:rotate-0 transition-transform duration-1000 opacity-50" />
                            <div className="relative bg-white -rotate-1 p-12 md:p-24 rounded-[3rem] border border-pink-50 shadow-xl group-hover:rotate-0 transition-all duration-700">
                                <div className="flex justify-center mb-12 text-amber-300">
                                    <i data-lucide="sparkles" className="w-12 h-12 animate-pulse"></i>
                                </div>
                                <p className="text-2xl md:text-4xl leading-[1.6] font-light text-gray-700 italic text-center">
                                    "Sevgili Duru, hayatımda tanıdığım en dürüst ve en harika kızlardan birisin. Seninle Cezayir'de tanıştığım için kendimi çok şanslı hissediyorum. Kalbinin güzelliği yüzüne yansıyor. Seni çok seviyoruz!"
                                </p>
                            </div>
                        </section>

                        <section>
                            <div className="text-center mb-20">
                                <h2 className="text-5xl font-serif text-gray-800 mb-6">Anı Defterimiz</h2>
                                <div className="h-1 w-20 bg-pink-200 mx-auto rounded-full" />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12">
                                {photos.map((photo, index) => (
                                    <div key={index} className="group bg-white p-5 pb-16 shadow-2xl transition-all duration-700 hover:-translate-y-6 hover:z-20 border border-gray-100"
                                        style={{ transform: `rotate(${(index % 2 === 0 ? -3 : 3) * (index + 1)}deg)` }}>
                                        <div className="aspect-square bg-gray-50 overflow-hidden relative rounded-sm">
                                            <img src={photo.url} className="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-1000 scale-110 group-hover:scale-100" />
                                            <div className="absolute inset-0 bg-pink-500/5 opacity-0 group-hover:opacity-100 transition-opacity" />
                                        </div>
                                        <div className="mt-8 text-center">
                                            <span className="font-serif italic text-gray-500 text-xl tracking-wide">{photo.caption}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section className="text-center relative">
                            <div className="bg-white rounded-[4rem] p-20 border-t-8 border-pink-100 shadow-[0_50px_100px_-20px_rgba(236,72,153,0.1)] max-w-2xl mx-auto">
                                <div className="flex justify-center mb-10 text-pink-500">
                                    <i data-lucide="heart" className="w-16 h-16 fill-current animate-bounce"></i>
                                </div>
                                <div className="min-h-[150px] flex items-center justify-center">
                                    <p className="text-4xl font-serif italic text-gray-800 leading-tight" key={complimentIndex}>
                                        "{compliments[complimentIndex]}"
                                    </p>
                                </div>
                                <button onClick={nextCompliment} className="mt-12 bg-gray-900 text-white px-16 py-6 rounded-full hover:bg-pink-600 transition-all shadow-2xl font-bold tracking-widest text-xs uppercase scale-110 active:scale-95">
                                    Sevgiyi Arttır ✨
                                </button>
                                <div className="mt-14 flex items-center justify-center gap-5">
                                    <div className="h-2 flex-1 bg-gray-50 rounded-full overflow-hidden shadow-inner">
                                        <div className="h-full bg-gradient-to-r from-pink-300 to-pink-500 transition-all duration-500" style={{ width: `${(clicks % 10) * 10}%` }} />
                                    </div>
                                    <span className="text-sm text-pink-400 font-black tracking-tighter">LVL {Math.floor(clicks/10) + 1}</span>
                                </div>
                            </div>
                        </section>

                        <section className="max-w-2xl mx-auto text-center bg-gray-950 p-16 rounded-[4rem] shadow-3xl relative overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-br from-pink-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-1000" />
                            <div className="relative z-10">
                                <h2 className="text-4xl font-serif text-white mb-4">Dilek Fenerleri</h2>
                                <p className="text-pink-200/40 text-xs mb-12 tracking-[0.4em] uppercase font-bold">Bir hayal kur ve gönder</p>
                                <form onSubmit={releaseWish} className="relative mb-16">
                                    <input type="text" value={currentWish} onChange={(e) => setCurrentWish(e.target.value)} placeholder="Buraya bir dilek fısılda..."
                                        className="w-full bg-white/5 border border-white/10 rounded-full px-10 py-6 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all text-white placeholder:text-white/20 text-xl font-light"
                                    />
                                    <button type="submit" className="absolute right-4 top-4 p-4 bg-pink-500 text-white rounded-full hover:bg-pink-400 shadow-xl transition-all active:scale-75">
                                        <i data-lucide="send" className="w-6 h-6"></i>
                                    </button>
                                </form>
                                <div className="flex flex-wrap justify-center gap-5">
                                    {wishes.map(wish => (
                                        <div key={wish.id} className="animate-float py-4 px-8 bg-white/5 rounded-2xl text-sm text-pink-100 border border-white/5 flex items-center gap-3 backdrop-blur-md">
                                            <i data-lucide="star" className="w-4 h-4 text-amber-400 fill-current"></i> {wish.text}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>
                    </main>

                    {message && (
                        <div className="fixed bottom-16 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-12 py-6 rounded-3xl shadow-[0_30px_60px_-12px_rgba(0,0,0,0.5)] z-[100] flex items-center gap-5 border border-white/10 animate-in fade-in slide-in-from-bottom-10">
                            <i data-lucide="sparkles" className="w-6 h-6 text-pink-400"></i>
                            <span className="text-sm font-bold tracking-wide">{message}</span>
                        </div>
                    )}

                    <footer className="bg-white py-48 px-6 border-t border-pink-50 text-center relative overflow-hidden">
                        <div className="max-w-4xl mx-auto space-y-16 relative z-10">
                            <i data-lucide="map-pin" className="w-10 h-10 text-pink-100 mx-auto"></i>
                            <div className="space-y-8">
                                <p className="text-gray-900 font-serif text-5xl italic leading-tight px-4">"İyi ki varsın Duru."</p>
                                <p className="text-gray-400 text-[10px] uppercase tracking-[1em] font-black">Always & Forever</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
